<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allowance Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Allowance Tracker</h1>
    </header>

    <section class="balance-card">
      <div class="balance-label">Current Balance</div>
      <div class="balance-amount" id="balance">$0.00</div>
    </section>

    <section class="actions">
      <h2>Add Money</h2>
      <div class="button-grid" id="addButtons">
        <button class="btn btn-add" type="button" data-amount="0.25">+$0.25</button>
        <button class="btn btn-add" type="button" data-amount="0.50">+$0.50</button>
        <button class="btn btn-add" type="button" data-amount="1.00">+$1.00</button>
        <button class="btn btn-add" type="button" data-amount="5.00">+$5.00</button>
        <button class="btn btn-add" type="button" data-amount="10.00">+$10.00</button>
      </div>

      <h2>Subtract Money</h2>
      <button class="btn btn-open-subtract" type="button" id="openSubtract">&minus; Record Expense</button>
    </section>

    <section class="history">
      <h2>Recent Transactions</h2>
      <ul class="transaction-list" id="transactionList">
        <li class="empty-state">No transactions yet.</li>
      </ul>
    </section>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalAmount">
      <div class="modal-amount" id="modalAmount">+$0.00</div>

      <div class="stepper" id="stepper" hidden>
        <button class="stepper-btn" type="button" id="stepDown" aria-label="Decrease by 25 cents">&minus;$0.25</button>
        <input class="custom-amount" type="number" id="customAmount" step="0.25" min="0.25" inputmode="decimal">
        <button class="stepper-btn" type="button" id="stepUp" aria-label="Increase by 25 cents">+$0.25</button>
      </div>

      <label class="note-label" for="noteInput">What's this for?</label>
      <input class="note-input" type="text" id="noteInput" placeholder="e.g. Weekly allowance" maxlength="100">

      <div class="quick-notes" id="quickNotes"></div>

      <div class="modal-error" id="modalError" hidden></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" type="button" id="confirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
